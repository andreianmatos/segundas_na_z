<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>segundas na z</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Scroll arrows - About page (both down) -->
<div class="scroll-indicators sobre-indicators active">
    <div class="scroll-arrow">↓</div>
    <div class="scroll-arrow">↓</div>
</div>
<!-- Scroll arrows - Program page (one up, one down) -->
<div class="scroll-indicators prog-indicators">
    <div class="scroll-arrow up">↓</div>
    <div class="scroll-arrow">↓</div>
</div>
<!-- Scroll arrows - Events page (both up) -->
<div class="scroll-indicators eventos-indicators">
    <div class="scroll-arrow up">↓</div>
    <div class="scroll-arrow up">↓</div>
</div>
<div class="snap-wrapper">
    
    <!-- Section 1: About -->
    <section id="sobre" class="snap-section">
        <div class="frame-container frame-small tracejado">
            <div class="hero-content">
                <img src="images/logos/2as-removebg.png" class="main-logo" alt="Logo">
                <div class="hero-text">
                    <p><i>Experimentação, encontro e partilha.</i></p>
                    <p>Segundas-feiras | 22h — 02h</p>
                    <p>Terraço ZDB, Lisboa</p>
                </div>
                <div class="hero-links">
                    <a href="mailto:segundasnaz@zedosbois.org">email</a> /
                    <a href="https://instagram.com/segundas_na_z" target="_blank">instagram</a>
                </div>
                <footer class="mini-footer">© 2026 segundas na z</footer>
            </div>
        </div>
    </section>

    <!-- Section 2: Program -->
    <section id="prog" class="snap-section">
        <div class="random-display" id="posters-container">
            <!-- Posters will be loaded dynamically -->
        </div>
    </section>

    <!-- Section 3: Events -->
    <section id="log" class="snap-section">
        <div class="random-display" id="events-container">
            <!-- Images will be loaded dynamically -->
        </div>
    </section>

</div>

<script src="js/script.js"></script>
</body>
</html>
