<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>segundas na z</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wall-container">
    
    <!-- Archive image full screen -->
    <section class="moment hero-moment">
        <img src="https://wsrv.nl/?url=https://raw.githubusercontent.com/andreianmatos/segundas_na_z/main/images/archive/1.JPG" alt="Archive Raw" class="full-screen-img">
    </section>

    <!-- Giant poster (full width, long scroll) -->
    <section class="moment poster-moment">
        <img src="https://wsrv.nl/?url=https://raw.githubusercontent.com/andreianmatos/segundas_na_z/main/images/programming/monthly_poster.png" alt="Poster Gigante" class="giant-poster">
    </section>

    <!-- Final info (logo and text) -->
    <section class="moment info-moment">
        <div class="info-cluster">
            <div class="icon-sticker">
                <img src="https://wsrv.nl/?url=https://raw.githubusercontent.com/andreianmatos/segundas_na_z/main/images/logos/2as-removebg.png" alt="Logo">
            </div>
            <div class="raw-text">
                <h1>segundas na z</h1>
                <p><i>experimentação, encontro e partilha</i></p>
                <p class="small-text">todas as segundas-feiras das 22h às 02h</p>
                <p class="small-text">no andar do terraço da galeria zé dos bois</p>
                <div class="links">
                    <a href="https://instagram.com/segundas_na_z" target="_blank">instagram</a>
                </div>
            </div>
        </div>
    </section>

    <!-- Archive section -->
    <section class="moment archive-moment">
        <div class="archive-wall">
            <div class="archive-grid" id="archiveGrid">
                <!-- Posters will be generated by JS -->
            </div>
        </div>
    </section>

</div>

<script src="js/archive.js"></script>
</body>
</html>
